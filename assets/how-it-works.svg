<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">How AssaySentinel reconstructs a measurement history</title>
  <desc id="desc">Scientists drop a long measurement history in. Detectors for CUSUM, PELT, Bayesian change-points, QC, calibration, and lots feed a reconstruction that returns a dated story, an uncertainty budget, charts, and provenance. explain and report deliver the result. Research use only  not a diagnostic medical device.</desc>
  <defs>
    <linearGradient id="headerFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2838"/>
      <stop offset="1" stop-color="#243447"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#2F7A78"/>
    </marker>
  </defs>

  <rect width="1120" height="640" rx="18" fill="#F4F1EA"/>
  <rect width="1120" height="92" rx="18" fill="url(#headerFade)"/>
  <rect y="74" width="1120" height="18" fill="#1B2838"/>

  <!-- mark -->
  <g transform="translate(28,16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 6 L52 19 L52 45 L30 58 L8 45 L8 19 Z" stroke="#2F7A78" stroke-width="2.2"/>
    <path d="M2 40 C10 40 14 39 20 39 C28 39 32 36 38 28 C44 20 50 17 60 16" stroke="#2F7A78" stroke-width="2"/>
    <circle cx="38" cy="28" r="2.6" fill="#C9892A" stroke="none"/>
  </g>
  <text x="100" y="40" fill="#F4F1EA" font-family="Segoe UI, Avenir Next, Helvetica, sans-serif" font-size="22" font-weight="600">How AssaySentinel works</text>
  <text x="100" y="66" fill="#C5D4D3" font-family="Georgia, Iowan Old Style, serif" font-size="14">Scientists drop a measurement history in. They get a dated, uncertainty-aware, plotted, provenance-complete reconstruction.</text>

  <!-- stage cards -->
  <g font-family="Segoe UI, Avenir Next, Helvetica, sans-serif">
    <!-- 1 -->
    <rect x="28" y="118" width="236" height="318" rx="12" fill="#FFFcf6" stroke="#D8D2C4"/>
    <rect x="28" y="118" width="236" height="44" rx="12" fill="#1B2838"/>
    <rect x="28" y="150" width="236" height="12" fill="#1B2838"/>
    <text x="48" y="146" fill="#C9892A" font-size="12" font-weight="700">01</text>
    <text x="74" y="146" fill="#F4F1EA" font-size="15" font-weight="600">Ingest</text>
    <text x="48" y="188" fill="#1B2838" font-size="13" font-weight="600">Long history in</text>
    <text x="48" y="210" fill="#5C6560" font-size="12">A year of results, not a</text>
    <text x="48" y="226" fill="#5C6560" font-size="12">single number.</text>
    <g fill="#2F7A78" font-size="12">
      <circle cx="54" cy="254" r="3"/><text x="66" y="258" fill="#1B2838">timestamps + analyte</text>
      <circle cx="54" cy="278" r="3"/><text x="66" y="282" fill="#1B2838">instrument / lot / batch</text>
      <circle cx="54" cy="302" r="3"/><text x="66" y="306" fill="#1B2838">calibration IDs</text>
      <circle cx="54" cy="326" r="3"/><text x="66" y="330" fill="#1B2838">QC controls</text>
      <circle cx="54" cy="350" r="3"/><text x="66" y="354" fill="#1B2838">measurement uncertainty</text>
    </g>
    <text x="48" y="400" fill="#8A918A" font-size="11">Missing and NaN are omitted,</text>
    <text x="48" y="416" fill="#8A918A" font-size="11">never coerced to zero.</text>

    <!-- 2 -->
    <rect x="304" y="118" width="236" height="318" rx="12" fill="#FFFcf6" stroke="#D8D2C4"/>
    <rect x="304" y="118" width="236" height="44" rx="12" fill="#1B2838"/>
    <rect x="304" y="150" width="236" height="12" fill="#1B2838"/>
    <text x="324" y="146" fill="#C9892A" font-size="12" font-weight="700">02</text>
    <text x="350" y="146" fill="#F4F1EA" font-size="15" font-weight="600">Detect</text>
    <text x="324" y="188" fill="#1B2838" font-size="13" font-weight="600">Explainable detectors</text>
    <text x="324" y="210" fill="#5C6560" font-size="12">Did the measurement process</text>
    <text x="324" y="226" fill="#5C6560" font-size="12">itself change?</text>
    <g font-size="11" font-weight="600">
      <rect x="324" y="246" width="92" height="28" rx="6" fill="#2F7A78"/><text x="370" y="264" text-anchor="middle" fill="#F4F1EA">CUSUM</text>
      <rect x="424" y="246" width="92" height="28" rx="6" fill="#2F7A78"/><text x="470" y="264" text-anchor="middle" fill="#F4F1EA">PELT</text>
      <rect x="324" y="282" width="92" height="28" rx="6" fill="#1B2838"/><text x="370" y="300" text-anchor="middle" fill="#F4F1EA">Bayesian</text>
      <rect x="424" y="282" width="92" height="28" rx="6" fill="#1B2838"/><text x="470" y="300" text-anchor="middle" fill="#F4F1EA">QC rules</text>
      <rect x="324" y="318" width="92" height="28" rx="6" fill="#C9892A"/><text x="370" y="336" text-anchor="middle" fill="#1B2838">Calibration</text>
      <rect x="424" y="318" width="92" height="28" rx="6" fill="#C9892A"/><text x="470" y="336" text-anchor="middle" fill="#1B2838">Lots</text>
    </g>
    <text x="324" y="380" fill="#8A918A" font-size="11">:auto explains why a method</text>
    <text x="324" y="396" fill="#8A918A" font-size="11">was chosen. Association is</text>
    <text x="324" y="412" fill="#8A918A" font-size="11">not treated as causation.</text>

    <!-- 3 -->
    <rect x="580" y="118" width="236" height="318" rx="12" fill="#FFFcf6" stroke="#D8D2C4"/>
    <rect x="580" y="118" width="236" height="44" rx="12" fill="#1B2838"/>
    <rect x="580" y="150" width="236" height="12" fill="#1B2838"/>
    <text x="600" y="146" fill="#C9892A" font-size="12" font-weight="700">03</text>
    <text x="626" y="146" fill="#F4F1EA" font-size="15" font-weight="600">Reconstruct</text>
    <text x="600" y="188" fill="#1B2838" font-size="13" font-weight="600">Four deliverables</text>
    <text x="600" y="210" fill="#5C6560" font-size="12">One dated analytical story,</text>
    <text x="600" y="226" fill="#5C6560" font-size="12">not a black-box score.</text>
    <g font-size="12">
      <rect x="600" y="246" width="196" height="34" rx="6" fill="#1B2838"/>
      <text x="616" y="268" fill="#C9892A" font-weight="700">Story</text>
      <text x="666" y="268" fill="#F4F1EA">dated event chain</text>
      <rect x="600" y="288" width="196" height="34" rx="6" fill="#2F7A78"/>
      <text x="616" y="310" fill="#F4F1EA" font-weight="700">Uncertainty</text>
      <text x="710" y="310" fill="#F4F1EA">budget + SE</text>
      <rect x="600" y="330" width="196" height="34" rx="6" fill="#1B2838"/>
      <text x="616" y="352" fill="#C9892A" font-weight="700">Charts</text>
      <text x="670" y="352" fill="#F4F1EA">control + lots</text>
      <rect x="600" y="372" width="196" height="34" rx="6" fill="#2F7A78"/>
      <text x="616" y="394" fill="#F4F1EA" font-weight="700">Provenance</text>
      <text x="706" y="394" fill="#F4F1EA">steps + rng</text>
    </g>

    <!-- 4 -->
    <rect x="856" y="118" width="236" height="318" rx="12" fill="#FFFcf6" stroke="#D8D2C4"/>
    <rect x="856" y="118" width="236" height="44" rx="12" fill="#1B2838"/>
    <rect x="856" y="150" width="236" height="12" fill="#1B2838"/>
    <text x="876" y="146" fill="#C9892A" font-size="12" font-weight="700">04</text>
    <text x="902" y="146" fill="#F4F1EA" font-size="15" font-weight="600">Deliver</text>
    <text x="876" y="188" fill="#1B2838" font-size="13" font-weight="600">explain()  ·  report()</text>
    <text x="876" y="210" fill="#5C6560" font-size="12">Human narrative and an</text>
    <text x="876" y="226" fill="#5C6560" font-size="12">auditable laboratory report.</text>
    <rect x="876" y="246" width="196" height="52" rx="6" fill="#E7E2D6"/>
    <text x="888" y="268" fill="#1B2838" font-size="12" font-family="Consolas, ui-monospace, monospace">explain(result)</text>
    <text x="888" y="286" fill="#5C6560" font-size="11">story, budget, evidence</text>
    <rect x="876" y="308" width="196" height="52" rx="6" fill="#E7E2D6"/>
    <text x="888" y="330" fill="#1B2838" font-size="12" font-family="Consolas, ui-monospace, monospace">report(result, path)</text>
    <text x="888" y="348" fill="#5C6560" font-size="11">.html  .md  .json  .assay</text>
    <text x="876" y="388" fill="#8A918A" font-size="11">Reproducible: rng seed and</text>
    <text x="876" y="404" fill="#8A918A" font-size="11">input fingerprint travel with</text>
    <text x="876" y="420" fill="#8A918A" font-size="11">every conclusion.</text>
  </g>

  <!-- connectors -->
  <line x1="264" y1="270" x2="304" y2="270" stroke="#2F7A78" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="270" x2="580" y2="270" stroke="#2F7A78" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="816" y1="270" x2="856" y2="270" stroke="#2F7A78" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- reconstruction strip -->
  <rect x="28" y="454" width="1064" height="108" rx="12" fill="#1B2838"/>
  <text x="48" y="480" fill="#C5D4D3" font-family="Segoe UI, sans-serif" font-size="12">Reconstruction chain  ·  temporal association, not causation</text>
  <g font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">
    <rect x="48" y="496" width="200" height="44" rx="8" fill="#2F7A78"/>
    <text x="148" y="524" text-anchor="middle" fill="#F4F1EA">Stable</text>
    <text x="262" y="524" fill="#C9892A" font-size="20">’</text>
    <rect x="284" y="496" width="200" height="44" rx="8" fill="#243447" stroke="#C9892A"/>
    <text x="384" y="524" text-anchor="middle" fill="#F4F1EA">Calibration</text>
    <text x="498" y="524" fill="#C9892A" font-size="20">’</text>
    <rect x="520" y="496" width="220" height="44" rx="8" fill="#243447" stroke="#C9892A"/>
    <text x="630" y="524" text-anchor="middle" fill="#F4F1EA">Lot change</text>
    <text x="754" y="524" fill="#C9892A" font-size="20">’</text>
    <rect x="776" y="496" width="292" height="44" rx="8" fill="#C9892A"/>
    <text x="922" y="524" text-anchor="middle" fill="#1B2838">Drift</text>
  </g>

  <rect x="28" y="580" width="1064" height="40" rx="8" fill="#E7E2D6"/>
  <text x="560" y="605" text-anchor="middle" fill="#1B2838" font-family="Georgia, Iowan Old Style, serif" font-size="13">Research, analytical-quality, and scientific decision support  not a diagnostic medical device, and not a substitute for clinical judgment.</text>
</svg>
